UntrustedKickMessage: |

  OverseerAC marked your account as untrusted.
  OverseerAC is a community project NOT AFFILIATED with Northwood. 

  This usually happens if your account is set to Private.
  
  Try changing your Steam privacy settings to Public and try again in 10 minutes.
  You can Private the profile afterwards, but you may be unable to join after 24 hours.
  If that happens, set the profile to Public, then try to join and Private it again.

  If you still cannot join, you can request a whitelist on our Discord server: https://api.overseerac.eu/discord
  Whitelist requests from new accounts will be rejected unless you have a more trustworthy main account.

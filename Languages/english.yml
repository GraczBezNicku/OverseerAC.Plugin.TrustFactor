UntrustedKickMessage: |

  OverseerAC marked your account as untrusted.
  OverseerAC is a community project NOT AFFILIATED with Northwood. 

  This can happen for several reasons, including, but not limited to:
  - Your account being marked as Private
  - Your game activity being marked as Private
  - Using a proxy (such as a VPN) when playing the game

  Try to change your privacy settings and disconnect from any proxies.
  You can try to join the server again 10 minutes after you've been kicked.

  If you still cannot join, you can request a whitelist on our Discord server: https://api.overseerac.eu/discord
  Whitelist requests from new accounts will be rejected unless you have a valid way to prove your legitimacy.
